[package]
name = "openmusic_sdk"
version = "0.1.0"
repository = "https://github.com/LiteVar/openmusic"
description = "A provider-neutral HTTP API for music generation. Submit a request, poll the task, then download the generated tracks. Discover a model's supported parameters and constraints before submitting a request.  Implementations choose how to run music generation. Clients use the same task protocol for synchronous and asynchronous generation backends. "
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
